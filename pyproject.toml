[project]
name = "instagram-unfollower-checker"
version = "1.0.0"
description = "Web application untuk tracking Instagram unfollowers"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "instagrapi>=2.1.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.uv]
dev-dependencies = []
